name: Render and Publish Skins Page

on:
  # Runs are started on the update schedule (every 20 min 6:00 PM - 12:40 AM Central, plus 6 AM, 9 AM,
  # 12 PM, 3 PM) by the external scheduler through workflow_dispatch, and by the "Refresh now" button.
  # GitHub's own cron is not used: it fires late and duplicates those runs.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if all of today's games are already final and published"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.settled.outputs.settled != 'true' }}
    steps:
      # Once every game of the skins day is final, saved and published, a run has nothing left to
      # update, so skip it - and with it every request to the sites the scores and odds come from.
      # The script only says "settled" when ESPN, the history file and the published page all agree;
      # if it can't tell (or these steps fail), the run goes ahead as usual. "Run workflow" with
      # "force" ticked always runs.
      - name: Check out repository
        if: inputs.force != true
        continue-on-error: true
        uses: actions/checkout@v4

      - id: settled
        if: inputs.force != true
        continue-on-error: true
        run: |
          if timeout 90 python3 .github/scripts/day_settled.py; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A normal run takes 2-4 minutes; fail a hung one (e.g. a stalled R download) so the next update can go
    timeout-minutes: 15
    # One render at a time, so a manual refresh during a scheduled run waits instead of racing it
    concurrency:
      group: render-skins
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true 

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rvest
            any::httr
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::tibble
            any::knitr
            any::kableExtra
            any::readr
            any::ggplot2
            any::pacman

      - name: Create history directory
        run: mkdir -p skins_history

      - name: Render Quarto Document
        run: quarto render skins_today.qmd --to html --output-dir _site --output index.html

      - name: Add past seasons
        run: |
          # Past seasons: publish each archive/<season>/index.html at /<season>/
          for d in archive/*/; do
            if [ -f "${d}index.html" ]; then
              mkdir -p "_site/$(basename "$d")" && cp "${d}index.html" "_site/$(basename "$d")/index.html"
            fi
          done

      - name: Commit history updates
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add skins_history/*.csv
          git diff --staged --quiet || git commit -m "Update skins history - $(date +'%Y-%m-%d')"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
