name: Render and Publish Skins Page

on:
  # Central time: every 20 min 6:00 PM - 1:40 AM (game time, up to the 2 AM skins-day cutoff), plus 6 AM, 9 AM, 12 PM, 3 PM
  schedule:
    - cron: '*/20 23,0-6 * * *'         # CDT (UTC-5) game time
    - cron: '0 11,14,17,20 * * *'       # CDT (UTC-5) daytime
    - cron: '*/20 0-7 * * *'            # CST (UTC-6) game time
    - cron: '0 12,15,18,21 * * *'       # CST (UTC-6) daytime

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # GitHub schedules run on UTC; Chicago is UTC-5 (CDT) or UTC-6 (CST). Each Central time has a CDT
  # and a CST cron line above - this job lets through only the one that matches today's clock.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          zone=$(TZ=America/Chicago date +%Z)
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "*/20 23,0-6 * * *" | "0 11,14,17,20 * * *") [ "$zone" = "CDT" ] || run=false ;;
              "*/20 0-7 * * *" | "0 12,15,18,21 * * *") [ "$zone" = "CST" ] || run=false ;;
            esac
          fi
          echo "event=$EVENT cron='$CRON' chicago=$zone -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A normal run takes 2-4 minutes; fail a hung one (e.g. a stalled R download) so the next update can go
    timeout-minutes: 15
    # One render at a time, so a manual refresh during a scheduled run waits instead of racing it
    concurrency:
      group: render-skins
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'
          use-public-rspm: true 

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rvest
            any::httr
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::tibble
            any::knitr
            any::kableExtra
            any::readr
            any::ggplot2
            any::pacman

      - name: Create history directory
        run: mkdir -p skins_history

      - name: Render Quarto Document
        run: quarto render skins_today.qmd --to html --output-dir _site --output index.html

      - name: Add past seasons
        run: |
          # Past seasons: publish each archive/<season>/index.html at /<season>/
          for d in archive/*/; do
            if [ -f "${d}index.html" ]; then
              mkdir -p "_site/$(basename "$d")" && cp "${d}index.html" "_site/$(basename "$d")/index.html"
            fi
          done

      - name: Commit history updates
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add skins_history/*.csv
          git diff --staged --quiet || git commit -m "Update skins history - $(date +'%Y-%m-%d')"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
